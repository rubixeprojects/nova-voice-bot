# Windows Docker Compose configuration
# Run with:
# docker compose -f docker-compose.windows.yml up -d

services:
  postgres:
    image: docker.io/postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: assamese_rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: docker.io/qdrant/qdrant:v1.11.3
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage

  opensearch:
    image: docker.io/opensearchproject/opensearch:2.15.0
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - osdata:/usr/share/opensearch/data
    command: >
      bash -c "
      ./bin/opensearch-plugin list | grep -q analysis-icu ||
      ./bin/opensearch-plugin install --batch analysis-icu;
      ./opensearch-docker-entrypoint.sh"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: docker.io/redis:7
    ports:
      - "6379:6379"

  migrate:
    build: .
    command: alembic upgrade head
    environment:
      POSTGRES_URL: postgresql+psycopg://postgres:postgres@postgres:5432/assamese_rag
      QDRANT_URL: http://qdrant:6333
      OPENSEARCH_URL: http://opensearch:9200
      REDIS_URL: redis://redis:6379/0
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      POSTGRES_URL: postgresql+psycopg://postgres:postgres@postgres:5432/assamese_rag
      QDRANT_URL: http://qdrant:6333
      OPENSEARCH_URL: http://opensearch:9200
      REDIS_URL: redis://redis:6379/0
      HF_HUB_DISABLE_XET: "1"
    env_file:
      - path: .env
        required: false
    volumes:
      - .:/app
      - hf_cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started

  worker:
    build: .
    command: >
      celery -A app.workers.celery_app.celery_app worker
      --loglevel=INFO
      --concurrency=1
      --max-memory-per-child=1500000
    environment:
      POSTGRES_URL: postgresql+psycopg://postgres:postgres@postgres:5432/assamese_rag
      QDRANT_URL: http://qdrant:6333
      OPENSEARCH_URL: http://opensearch:9200
      REDIS_URL: redis://redis:6379/0
      HF_HUB_DISABLE_XET: "1"
    env_file:
      - path: .env
        required: false
    volumes:
      - .:/app
      - hf_cache:/root/.cache/huggingface
    mem_limit: 2g
    memswap_limit: 2g
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started

  ui:
    image: docker.io/python:3.11-slim
    command: >
      bash -c "pip install --quiet streamlit audio-recorder-streamlit &&
      streamlit run stt_streamlit.py --server.port 8503 --server.address 0.0.0.0"
    environment:
      API_BASE_URL: http://api:8000
    volumes:
      - .:/app
    working_dir: /app
    ports:
      - "8503:8503"
    depends_on:
      - api

volumes:
  pgdata:
  qdrantdata:
  osdata:
  hf_cache:
# Local full-stack for the Assamese RAG app.
#   postgres  — relational store
#   qdrant    — dense vectors
#   opensearch— BM25 (Indic-aware analyzer; ICU plugin installed on boot)
#   redis     — Celery broker/backend
#   minio     — S3-compatible object storage (+ minio-init creates the bucket)
#   migrate   — one-shot Alembic upgrade
#   api       — FastAPI (Swagger at :8000/docs)
#   worker    — Celery ingestion worker (embeddings via HF Inference when HF_TOKEN set)
#
# EMBEDDINGS: set HF_TOKEN in `.env` to use Hugging Face Inference API for BGE-M3.
# The worker/API then skip downloading the ~2 GB embedding model locally.
# Docker Desktop memory >= 4 GB is usually enough when HF_TOKEN is configured.
# Shared env for api/worker/migrate (override via `.env` if present).
x-app-env: &app-env
  POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/assamese_rag
  QDRANT_URL: http://localhost:6333
  OPENSEARCH_URL: http://localhost:9200
  REDIS_URL: redis://localhost:6379/0

services:
  postgres:
    image: docker.io/postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: assamese_rag
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: docker.io/qdrant/qdrant:v1.11.3
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrantdata:/qdrant/storage"]

  opensearch:
    image: docker.io/opensearchproject/opensearch:2.15.0
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
    ports: ["9200:9200"]
    volumes: ["osdata:/usr/share/opensearch/data"]
    # Install the ICU analysis plugin (Indic-script tokenization) then start.
    command: >
      bash -c "
      ./bin/opensearch-plugin list | grep -q analysis-icu ||
      ./bin/opensearch-plugin install --batch analysis-icu;
      ./opensearch-docker-entrypoint.sh"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: docker.io/redis:7
    ports: ["6379:6379"]

  migrate:
    build: .
    command: alembic upgrade head
    network_mode: host
    environment: *app-env
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    network_mode: host
    environment: *app-env
    env_file:
      - path: .env
        required: false
    volumes:
      - .:/app
    depends_on:
      postgres: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      qdrant: { condition: service_started }
      redis: { condition: service_started }

  worker:
    build: .
    command: >
      celery -A app.workers.celery_app.celery_app worker
      --loglevel=INFO
      --concurrency=1
      --max-memory-per-child=1500000
    network_mode: host
    environment: *app-env
    env_file:
      - path: .env
        required: false
    volumes:
      - .:/app
    # Worker stays light when HF_TOKEN handles embeddings; limit avoids runaway RAM.
    mem_limit: 2g
    memswap_limit: 2g
    depends_on:
      postgres: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      qdrant: { condition: service_started }
      redis: { condition: service_started }

  ui:
    image: docker.io/python:3.11-slim
    command: >
      bash -c "pip install --quiet streamlit audio-recorder-streamlit &&
               streamlit run stt_streamlit.py --server.port 8503 --server.address 0.0.0.0"
    network_mode: host
    environment:
      API_BASE_URL: http://localhost:8000
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      - api

volumes:
  pgdata:
  qdrantdata:
  osdata:
